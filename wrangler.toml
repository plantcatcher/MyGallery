name = "mygallery"
compatibility_date = "2026-01-01"
# 换成你的 Cloudflare 账户 ID（Dashboard 右下角 / `wrangler whoami` 可见）
account_id = "<YOUR_ACCOUNT_ID>"

# 纯静态托管：Worker 直接服务 dist/ 下的构建产物
# not_found_handling = "single-page-application" 是 SPA 的关键：
#   所有未匹配路由（如 /post/123）都回退到 index.html，交给 react-router 处理
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 想加自定义逻辑（缓存策略 / 鉴权 / API 路由 / 自定义响应头）时，
# 取消下面两行注释并在 src/ 下新建 worker 入口文件：
# main = "src/worker.ts"
# [observability]
# enabled = true
